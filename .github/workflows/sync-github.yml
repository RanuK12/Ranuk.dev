name: Sync GitHub data

# Snapshot del perfil público (repos + lenguajes) → data/github.json.
# Sin secretos: usa el GITHUB_TOKEN built-in para evitar rate-limit.
# El client-side consume el JSON committed; nada se llama desde el navegador.
#
# Antes commiteaba directo a main cada noche. main quedó protegida por ruleset (los cambios
# entran por PR), así que ahora deja el snapshot en la rama data/github-snapshot y abre un PR
# para que Emilio lo mergee cuando quiera refrescar Open Lab.

on:
  workflow_dispatch:  # botón manual

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch GitHub snapshot
        env:
          GITHUB_USER: RanuK12
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-github.mjs

      - name: Abrir PR si cambió
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z $(git status --porcelain data/github.json) ]]; then
            echo "Sin cambios en data/github.json"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B data/github-snapshot
          git add data/github.json
          git commit -m "chore(data): refresh GitHub snapshot"
          git push --force origin data/github-snapshot
          gh pr create --base main --head data/github-snapshot \
            --title "chore(data): refresh GitHub snapshot" \
            --body "Snapshot del perfil público para la sección Open Lab. Generado por el workflow." \
            || echo "Ya hay un PR abierto para esta rama"
